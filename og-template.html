<!DOCTYPE html>
<!--
  Source for assets/og.png — the link-preview card.
  Render at exactly 1200x630 and screenshot it, then save over assets/og.png.

  Carries the project name and nothing else: the hostname already reveals it,
  but previews are fetched by third-party servers and shown to anyone holding
  the link, so no figures, patents or technical claims belong here.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --black:   #0B0D0F;
  --slate:   #4C5A66;
  --white:   #F7FFFF;
  --gray:    #AABBBD;
  --red:     #FF073A;
  --red-3:   #A60525;
}

body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: var(--black);
  font-family: 'Sora', sans-serif;
  color: var(--white);
}

.card {
  position: relative;
  width: 1200px;
  height: 630px;
  padding: 88px 96px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
}

/* Neon red glows */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(52% 58% at 96% -8%, rgba(255, 7, 58, .30), transparent 68%),
    radial-gradient(42% 48% at -6% 106%, rgba(166, 5, 37, .30), transparent 68%);
}

/* Angular facet, echoing the identity's geometry */
.facet {
  position: absolute;
  top: -120px;
  right: -140px;
  width: 720px;
  height: 720px;
  background: linear-gradient(135deg, rgba(255, 7, 58, .10), rgba(166, 5, 37, .015) 62%, transparent);
  clip-path: polygon(38% 0, 100% 0, 100% 74%, 74% 100%, 0 46%);
}

.facet-2 {
  position: absolute;
  bottom: -190px;
  left: -150px;
  width: 560px;
  height: 560px;
  background: linear-gradient(315deg, rgba(255, 7, 58, .055), transparent 58%);
  clip-path: polygon(0 28%, 56% 0, 100% 52%, 62% 100%, 0 100%);
}

/* Corner brackets */
.corner {
  position: absolute;
  width: 46px;
  height: 46px;
  border-style: solid;
  border-color: var(--red);
  border-width: 0;
}

.corner.tl { top: 34px;    left: 34px;  border-top-width: 2px;    border-left-width: 2px; }
.corner.tr { top: 34px;    right: 34px; border-top-width: 2px;    border-right-width: 2px; }
.corner.bl { bottom: 34px; left: 34px;  border-bottom-width: 2px; border-left-width: 2px; }
.corner.br { bottom: 34px; right: 34px; border-bottom-width: 2px; border-right-width: 2px; }

.inner { position: relative; z-index: 2; }

/* Eyebrow */
.eyebrow {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: .44em;
  text-transform: uppercase;
  color: var(--slate);
  margin-bottom: 34px;
}

.eyebrow::before {
  content: "";
  width: 0; height: 0;
  border-left: 13px solid var(--red);
  border-top: 9px solid transparent;
  border-bottom: 9px solid transparent;
  flex: none;
}

h1 {
  font-size: 108px;
  font-weight: 400;
  line-height: 1.02;
  letter-spacing: .01em;
  text-transform: uppercase;
  color: var(--white);
}

.sub {
  margin-top: 26px;
  font-size: 26px;
  font-weight: 400;
  letter-spacing: .04em;
  color: var(--gray);
}

.bracket {
  margin-top: 40px;
  font-size: 23px;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--white);
}

.bracket .b { color: var(--red); }

/* Footer row */
.foot {
  position: absolute;
  left: 96px;
  right: 96px;
  bottom: 82px;
  z-index: 2;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--slate);
}

.rule {
  position: absolute;
  left: 96px;
  right: 96px;
  bottom: 136px;
  z-index: 2;
  height: 1px;
  background: linear-gradient(90deg, var(--red), rgba(76, 90, 102, .34) 42%, transparent);
}

.lock {
  display: flex;
  align-items: center;
  gap: 13px;
  color: var(--gray);
}
</style>
</head>
<body>

<div class="card">
  <div class="facet"></div>
  <div class="facet-2"></div>

  <span class="corner tl"></span>
  <span class="corner tr"></span>
  <span class="corner bl"></span>
  <span class="corner br"></span>

  <div class="inner">
    <div class="eyebrow">Restricted</div>
    <h1>Polish Engine</h1>
    <p class="sub">General Information on the Engine Project</p>
    <div class="bracket"><span class="b">[</span> Confidential &mdash; internal use only <span class="b">]</span></div>
  </div>

  <div class="rule"></div>

  <div class="foot">
    <span>IBS</span>
    <span class="lock">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FF073A" stroke-width="2.2" stroke-linecap="round">
        <rect x="4" y="11" width="16" height="10"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
      Password required
    </span>
  </div>
</div>

</body>
</html>
